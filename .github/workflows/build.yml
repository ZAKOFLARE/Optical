name: build

# 打 tag（v*）或手动触发时构建全平台产物。
# 平时 push 不构建——交叉编译慢，没必要每提交都跑。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 苹果两系芯片：macOS 本机/CI 是唯一能出这两个产物的地方
          # （ring 需要 macOS SDK，Windows/Linux 交叉不出来）
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          # Linux 静态，任何发行版都能跑
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          # ARM：v8 是 aarch64，v7 是 armv7（硬浮点）。都走 Zig 交叉——
          # ring 的 C/asm 需要交叉编译器，Ubuntu 的 apt 没有 ARM musl 工具链，
          # Zig 的 cc 一个工具链覆盖所有 target，是最省事的路子。
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true }
          - { os: ubuntu-latest, target: armv7-unknown-linux-musleabihf, zig: true }
          # Windows：gnu 交叉 + msvc 本机各一份
          - { os: ubuntu-latest, target: x86_64-pc-windows-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 musl 链接器（Linux x64 静态）
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: 安装 mingw-w64（Windows GNU 交叉）
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get install -y mingw-w64

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装 Zig 交叉工具链（ARM）
        if: matrix.zig
        run: pip install cargo-zigbuild ziglang

      - name: 构建
        if: matrix.zig != true
        run: cargo build --release --target ${{ matrix.target }}

      - name: 构建（Zig 交叉，ARM）
        if: matrix.zig
        run: cargo zigbuild --release --target ${{ matrix.target }}

      # 产物都在标准 target 目录，zig 和原生构建的输出路径一致
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: optical-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/optical
            target/${{ matrix.target }}/release/optical.exe
          if-no-files-found: ignore
