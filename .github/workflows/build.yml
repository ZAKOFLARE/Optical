name: build

# 打 tag（v*）或手动触发时构建全平台产物。
# 平时 push 不构建——交叉编译慢，没必要每提交都跑。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 苹果两系芯片：macOS 本机/CI 是唯一能出这两个产物的地方
          # （ring 需要 macOS SDK，Windows/Linux 交叉不出来）
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          # Linux 静态，任何发行版都能跑
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          # Windows：gnu 交叉 + msvc 本机各一份
          - { os: ubuntu-latest, target: x86_64-pc-windows-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 musl 链接器（Linux 静态）
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: 安装 mingw-w64（Windows GNU 交叉）
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get install -y mingw-w64

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 构建
        run: cargo build --release --target ${{ matrix.target }}

      # 缓存 target 目录，重复构建省一半时间
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: optical-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/optical
            target/${{ matrix.target }}/release/optical.exe
          if-no-files-found: ignore
