[package]
name = "optical"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Optical - 跨平台网关：转发/路由 + WAF + TLS + 双操作面"
license = "MIT"
publish = false

[[bin]]
name = "optical"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "time",
    "sync",
    "fs",
    # 动态项目管理要拉起子进程并读它的 stdout/stderr
    "process",
    "io-util",
] }
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = [
    "server-auto",
    "client-legacy",
    "http1",
    "http2",
    "tokio",
] }
http = "1"
http-body-util = "0.1"
bytes = "1"
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
# 只为一件事：v6 监听显式打 IPV6_V6ONLY（tokio 的 TcpSocket 没这个开关）
socket2 = "0.6"

# TLS / 证书
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls-pemfile = "2"
rcgen = "0.13"
time = { version = "0.3", features = ["std"] }

# 管理面认证：口令哈希(argon2id) + TOTP(HMAC，摘要可配) + 会话令牌(CSPRNG)
# sha1 只用于 RFC 6455 的 WebSocket 握手校验与 TOTP 默认算法，不承担任何口令/令牌安全职责
argon2 = "0.5"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
# 管理面 TOTP 二维码：服务端渲染 SVG，不引任何 CDN/前端库
qrcode = "0.14"
rand = "0.8"

# WAF：cookie 压缩比判定需要真的解压（带解压上限，防 zip bomb）
flate2 = "1"
x509-parser = { version = "0.18", default-features = false }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
